name: Build and Release MaZze Sports TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore from Secret if present
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "Restoring debug.keystore from secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > debug.keystore
          else
            echo "DEBUG_KEYSTORE_B64 secret not set, will use default or generated debug keystore"
          fi

      - name: Stamp versionCode with github.run_number
        run: |
          RUN_NUM="${{ github.run_number }}"
          echo "Stamping versionCode=$RUN_NUM in app/build.gradle.kts"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $RUN_NUM/g" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"build $RUN_NUM\"/g" app/build.gradle.kts

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :app:assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/MaZze-Sports-Gemini.apk
            echo "APK ready at release-output/MaZze-Sports-Gemini.apk"
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Gemini-latest
          name: MaZze Sports TV (Build ${{ github.run_number }})
          body: "Automated build ${{ github.run_number }}"
          files: release-output/MaZze-Sports-Gemini.apk
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
